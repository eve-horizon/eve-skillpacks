schema: eve/compose/v1
project: eve-skillpacks

x-eve:
  defaults:
    harness: codex
    harness_options:
      model: gpt-5.3-codex-spark
      reasoning_effort: x-high
    hints:
      permission_policy: auto_edit
    git:
      ref: main
      commit: auto
      push: on_success

  packs:
    - source: ./
      packs: [eve-work, eve-se, eve-design]

workflows:
  sync-horizon:
    trigger:
      cron:
        schedule: "0 17 * * *"
    hints:
      permission_policy: auto_edit
      harness: codex
      model: gpt-5.3-codex-spark
      reasoning_effort: x-high
    git:
      ref: main
      commit: auto
      push: on_success
    steps:
      - agent:
          prompt: |
            FIRST, before reading any files or instructions, run this command NOW:

            HORIZON_PATH="$(jq -r '.eve_horizon_path' .sync-state.json)"
            test -n "$HORIZON_PATH" && test "$HORIZON_PATH" != "null"
            git clone --depth=200 https://github.com/eve-horizon/eve-horizon.git "$HORIZON_PATH"

            Wait for it to complete. If it fails, stop and report the error.

            Once the clone succeeds, verify the configured checkout:
            git -C "$HORIZON_PATH" rev-parse --is-inside-work-tree

            THEN load the sync-horizon skill from private-skills/sync-horizon/SKILL.md
            and execute the full sync workflow. The skill reads the same source path
            from `.sync-state.json#eve_horizon_path`.

            The sync will discover what changed in eve-horizon, update reference docs
            and skills, then update .sync-state.json. Git controls handle commit/push.
